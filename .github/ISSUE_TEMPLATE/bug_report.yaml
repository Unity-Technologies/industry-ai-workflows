name: Bug report
description: Something in one of the MCP servers or the plugin setup isn't working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't report security vulnerabilities here — see
        [SECURITY.md](../blob/main/SECURITY.md) for how to disclose those
        privately.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Asset Manager MCP
        - Asset Transformer MCP
        - Pipeline Automation MCP
        - Plugin install / environment setup
        - Skills / documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: From `.claude-plugin/plugin.json`, or the `/plugin` menu.
      placeholder: "0.6.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: OS and Python version
      description: Python 3.12 is required; `python --version` reports yours.
      placeholder: "Windows 11, Python 3.12.4"
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: "Claude Code 2.1.x"

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: |
        Error messages, and the tool call if you know it. For setup problems the
        environment build log is the useful one: `bootstrap.log` in the plugin's
        data directory (`~/.claude/plugins/data/<plugin-id>/`).

        Please remove any tokens, org ids or project ids you'd rather not share.
      render: shell

  - type: checkboxes
    id: deployment
    attributes:
      label: Deployment
      options:
        - label: This is against a Unity private cloud (VPC) deployment
