# Smoke checks for what this repository ships.
#
# Scope is deliberately narrow. Exercising these servers properly needs Unity
# Cloud credentials and a Pixyz licence, neither of which belongs in public CI.
# This job answers a smaller question that is still worth answering on every
# change: do the manifests parse and agree, do the servers import on a clean
# machine, and do they still present a well-formed tool surface?
#
# Asset Transformer is not covered by the import job: it needs the pxz SDK from
# Unity's Pixyz package index and a licence server, neither of which belongs in
# public CI. Its manifests are still checked.

name: Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifests:
    name: Manifests parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the marketplace and every plugin it lists
        run: |
          python - <<'PY'
          import json, re, sys
          from pathlib import Path

          # Everything is derived from the marketplace manifest, so adding a
          # plugin needs no edit to this workflow. The previous version indexed
          # plugins[0] and read one plugin.json, which could only ever check a
          # single-plugin marketplace.
          failures = []

          def load(path):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{path}: {exc}")
                  return None

          market = load(".claude-plugin/marketplace.json")
          if market is None:
              sys.exit("FAILED:\n  " + "\n  ".join(failures))

          print(f"marketplace {market['name']} {market.get('version', '(unversioned)')}")

          # Files a plugin cannot work without once installed. Claude Code
          # copies only a plugin's own subtree into its cache, so a shared copy
          # at the repo root would simply not be there.
          required = [
              ".claude-plugin/plugin.json",
              "mcp-servers.json",
              "hooks/hooks.json",
              "install.py",
              "bootstrap.py",
              "uninstall.py",
          ]

          seen_names, seen_ids = set(), set()
          for entry in market["plugins"]:
              root = Path(entry["source"])
              if not root.is_dir():
                  failures.append(f"{entry['name']}: source {root} is not a directory")
                  continue

              plugin = load(root / ".claude-plugin" / "plugin.json")
              if plugin is None:
                  continue

              if plugin["name"] != entry["name"]:
                  failures.append(
                      f"marketplace entry {entry['name']!r} != plugin name "
                      f"{plugin['name']!r} — these compose into the install command "
                      "and the plugin data directory id"
                  )
              if not plugin.get("version"):
                  failures.append(f"{entry['name']}: no version in plugin.json")
              if "version" in entry:
                  failures.append(
                      f"{entry['name']}: version set in BOTH the marketplace entry and "
                      "plugin.json; Claude Code uses the plugin.json value silently"
                  )

              if plugin["name"] in seen_names:
                  failures.append(f"duplicate plugin name {plugin['name']!r}")
              seen_names.add(plugin["name"])
              data_id = f"{plugin['name']}-{market['name']}"
              if data_id in seen_ids:
                  failures.append(f"duplicate plugin data dir id {data_id!r}")
              seen_ids.add(data_id)

              for rel in required:
                  if not (root / rel).exists():
                      failures.append(f"{entry['name']}: missing {rel}")

              mcp = load(root / "mcp-servers.json")
              if mcp:
                  declared = set(plugin.get("userConfig") or {})
                  used = set(re.findall(r"\$\{user_config\.([A-Za-z0-9_]+)\}", json.dumps(mcp)))
                  for key in sorted(used - declared):
                      failures.append(
                          f"{entry['name']}: mcp-servers.json passes ${{user_config.{key}}} "
                          "with no userConfig entry — the server gets an empty string"
                      )
                  for key in sorted(declared - used):
                      failures.append(
                          f"{entry['name']}: userConfig declares {key} but no server "
                          "receives it — a setting nothing reads"
                      )
                  if "${CLAUDE_PLUGIN_ROOT}/.." in json.dumps(mcp):
                      failures.append(
                          f"{entry['name']}: a component path leaves the plugin root; "
                          "Claude Code refuses those"
                      )

              hooks = load(root / "hooks" / "hooks.json")
              if hooks and "SessionStart" not in (hooks.get("hooks") or {}):
                  failures.append(f"{entry['name']}: hooks.json declares no SessionStart hook")

              print(f"ok   {entry['name']} {plugin.get('version')} <- {root}")

          if failures:
              sys.exit("FAILED:\n  " + "\n  ".join(failures))
          print(f"\n{len(market['plugins'])} plugin(s) OK")
          PY

  servers:
    name: ${{ matrix.server }} imports (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Asset Transformer is excluded: pxz comes from Unity's Pixyz package
        # index and needs a licence server. Kept explicit rather than derived
        # from the marketplace, because the exclusion is the point.
        server: [Asset_Manager_MCP, Pipeline_Automation_MCP]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet -r ${{ matrix.server }}/requirements.txt
      - name: Import and inspect the tool surface
        shell: bash
        env:
          SERVER_DIR: ${{ matrix.server }}
        run: |
          python - <<'PY'
          import asyncio, os, sys
          from pathlib import Path

          server_dir = Path(os.environ["SERVER_DIR"])

          # ONLY the plugin root goes on sys.path — exactly what Claude Code
          # gives the server when it runs <plugin>/<server>.py. The repo root
          # used to be added as well, for the shared/ package that no longer
          # exists; leaving it would let a stale cross-plugin import pass here
          # and fail on a real install.
          sys.path.insert(0, str(server_dir))

          module = next(p.stem for p in server_dir.glob("*_mcp_server.py"))
          server = __import__(module)

          tools = asyncio.run(server.mcp.list_tools())
          print(f"{module}: {len(tools)} tools")

          problems = []
          if not tools:
              problems.append("no tools registered")
          for tool in tools:
              if not (tool.description or "").strip():
                  problems.append(f"{tool.name}: no description")
              schema = tool.input_schema
              if not isinstance(schema, dict) or schema.get("type") != "object":
                  problems.append(f"{tool.name}: input schema is not an object")

          names = [t.name for t in tools]
          if len(names) != len(set(names)):
              problems.append("duplicate tool names")

          leaked = [m for m in sys.modules if m.startswith("shared")]
          if leaked:
              problems.append(f"imported the dissolved shared package: {leaked}")

          if problems:
              sys.exit("FAILED:\n  " + "\n  ".join(problems))
          print("tool surface OK")
          PY
